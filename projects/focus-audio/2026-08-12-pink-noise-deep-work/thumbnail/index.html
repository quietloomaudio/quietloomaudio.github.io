<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>Soft Pink Noise — YouTube Thumbnail</title>
  <link rel="stylesheet" href="thumbnail.css">
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <symbol id="waveform" viewBox="0 0 48 48"><path d="M3 24h5l2.5-8 4 18 4-27 4 34 4-27 4 20 4-13 3 7 2-4H45"/></symbol>
    <symbol id="headphones" viewBox="0 0 48 48"><path d="M10 26v-3c0-8 6-14 14-14s14 6 14 14v3"/><path d="M10 25H8c-2 0-3 2-3 4v7c0 3 2 5 5 5h4V24h-4v17"/><path d="M38 25h2c2 0 3 2 3 4v7c0 3-2 5-5 5h-4V24h4v17"/></symbol>
    <symbol id="moon" viewBox="0 0 48 48"><path d="M37 34A18 18 0 0 1 18 6a18 18 0 1 0 19 28Z"/></symbol>
  </svg>

  <main class="thumbnail" aria-label="Soft Pink Noise YouTube thumbnail">
    <img class="thumbnail__plate" src="assets/pink-particle-wave-plate-v1.jpg" alt="">
    <div class="thumbnail__veil"></div>
    <div class="thumbnail__grain"></div>

    <header class="brand-lockup">
      <img class="brand-lockup__logo" src="../channel/logo/quietloom-audio-lockup.svg" alt="Quietloom Audio">
    </header>

    <section class="copy-stack">
      <div class="hero-copy">
        <h1 class="display">Soft<br><span class="display__accent">Pink</span><br>Noise</h1>
      </div>
      <p class="tagline">Calm Mind. Better Focus. Deep Rest.</p>
    </section>

    <aside class="duration" aria-label="60 minute seamless loop">
      <svg class="icon"><use href="#waveform"/></svg>
      <div class="duration__rule"></div>
      <div class="duration__value">60</div>
      <div class="duration__label">Minutes</div>
      <div class="duration__rule"></div>
      <div class="duration__foot">Seamless<br>Loop</div>
    </aside>

    <footer class="features">
      <div class="feature">
        <svg class="icon icon--small"><use href="#waveform"/></svg>
        <div class="feature__copy">Pink Noise<br>Balanced</div>
      </div>
      <div class="feature__divider"></div>
      <div class="feature">
        <svg class="icon icon--small"><use href="#headphones"/></svg>
        <div class="feature__copy">Headphones<br>Optimized</div>
      </div>
      <div class="feature__divider"></div>
      <div class="feature">
        <svg class="icon icon--small"><use href="#moon"/></svg>
        <div class="feature__copy">Sleep | Study<br>Relax | Work</div>
      </div>
    </footer>

    <div class="seal" aria-label="Sound for focus and rest">
      <svg class="seal__art" viewBox="0 0 112 112" role="img" aria-hidden="true">
        <defs>
          <path id="sealTopPath" d="M 18,56 A 38,38 0 0,1 94,56"/>
          <path id="sealBottomPath" d="M 94,56 A 38,38 0 0,1 18,56"/>
        </defs>
        <circle cx="56" cy="56" r="52"/>
        <text><textPath href="#sealTopPath" startOffset="50%" text-anchor="middle">Sound for</textPath></text>
        <text><textPath href="#sealBottomPath" startOffset="50%" text-anchor="middle">Focus &amp; Rest</textPath></text>
        <g class="seal-wave" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 24h5l2.5-8 4 18 4-27 4 34 4-27 4 20 4-13 3 7 2-4H45"/>
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
