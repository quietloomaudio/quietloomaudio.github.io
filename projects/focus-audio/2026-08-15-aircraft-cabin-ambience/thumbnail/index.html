<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>A380 Cabin Full Flight — YouTube Thumbnail</title>
  <link rel="stylesheet" href="thumbnail.css">
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <symbol id="aircraft" viewBox="0 0 64 64"><path d="M31.8 5.5c2.1 0 3.2 4.1 3.2 7.6v11.4l18.7 10.7v4.5L35 34.1v12.6l6.6 5v3.6l-9.8-3.1-9.8 3.1v-3.6l6.6-5V34.1L10 39.7v-4.5l18.6-10.7V13.1c0-3.5 1.1-7.6 3.2-7.6Z"/></symbol>
    <symbol id="waveform" viewBox="0 0 48 48"><path d="M3 24h5l2.5-8 4 18 4-27 4 34 4-27 4 20 4-13 3 7 2-4H45"/></symbol>
    <symbol id="headphones" viewBox="0 0 48 48"><path d="M10 27v-4c0-8 6-14 14-14s14 6 14 14v4"/><path d="M10 25H8c-2 0-3 2-3 4v7c0 3 2 5 5 5h4V24h-4v17M38 25h2c2 0 3 2 3 4v7c0 3-2 5-5 5h-4V24h4v17"/></symbol>
    <symbol id="moon" viewBox="0 0 48 48"><path d="M37 34A18 18 0 0 1 18 6a18 18 0 1 0 19 28Z"/></symbol>
  </svg>

  <main class="thumbnail" aria-label="A380 Cabin Full Flight ambience YouTube thumbnail">
    <img class="thumbnail__plate" src="../visuals/cover/source/focus-audio-005_cover-plate-original_v1.png" alt="">
    <div class="thumbnail__veil"></div>
    <div class="thumbnail__grain"></div>

    <header class="brand-lockup brand-lockup--centered">
      <img class="brand-lockup__logo" src="assets/quietloom-audio-lockup-cyan.svg" alt="Quietloom Audio">
    </header>

    <div class="flight-path" aria-hidden="true"><span class="flight-path__line"></span><svg class="flight-path__plane"><use href="#aircraft"/></svg><span class="flight-path__line"></span></div>

    <section class="copy-stack copy-stack--centered">
      <h1 class="display"><span class="display__aircraft">A380 Cabin</span><span class="display__accent">Full Flight</span></h1>
      <p class="tagline">Realistic Overnight Ambience</p>
    </section>

    <aside class="duration duration--episode-minimal" aria-label="7 hours">
      <div class="duration-minimal__number">7</div>
      <div class="duration-minimal__band">Hours</div>
    </aside>

    <footer class="features features--centered">
      <div class="feature"><svg class="icon icon--small"><use href="#aircraft"/></svg><div class="feature__copy">Taxi • Takeoff<br>Cruise • Landing</div></div>
      <div class="feature__divider"></div>
      <div class="feature"><svg class="icon icon--small"><use href="#headphones"/></svg><div class="feature__copy">Realistic Cabin<br>No Music</div></div>
      <div class="feature__divider"></div>
      <div class="feature"><svg class="icon icon--small"><use href="#moon"/></svg><div class="feature__copy">Sleep • Study<br>Focus • Relax</div></div>
    </footer>
  </main>
</body>
</html>
