<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=1280, initial-scale=1'>
  <title>Distant Thunder City Rainstorm - YouTube Thumbnail</title>
  <link rel='stylesheet' href='thumbnail.css'>
  <script defer src='../../../../templates/youtube-thumbnail/fit-text.js'></script>
</head>
<body>
  <svg width='0' height='0' aria-hidden='true' style='position:absolute'>
    <symbol id='waveform' viewBox='0 0 48 48'><path d='M3 24h5l2.5-8 4 18 4-27 4 34 4-27 4 20 4-13 3 7 2-4H45'/></symbol>
    <symbol id='headphones' viewBox='0 0 48 48'><path d='M10 27v-4c0-8 6-14 14-14s14 6 14 14v4'/><path d='M10 25H8c-2 0-3 2-3 4v7c0 3 2 5 5 5h4V24h-4v17M38 25h2c2 0 3 2 3 4v7c0 3-2 5-5 5h-4V24h4v17'/></symbol>
    <symbol id='moon' viewBox='0 0 48 48'><path d='M37 34A18 18 0 0 1 18 6a18 18 0 1 0 19 28Z'/></symbol>
  </svg>
  <main class='thumbnail' aria-label='Distant thunder and city rainstorm ambience YouTube thumbnail'>
    <img class='thumbnail__plate' src='sources/focus-audio-007_thumbnail-base-frame_v1.png' alt=''>
    <div class='thumbnail__veil'></div><div class='thumbnail__grain'></div>
    <header class='brand-lockup'><img class='brand-lockup__logo' src='assets/quietloom-audio-lockup-cyan.svg' alt='Quietloom Audio'></header>
    <section class='copy-stack copy-stack--safe-centered'>
      <h1 class='display'><span class='display__layout-b-first' data-fit-text>Distant Thunder</span><span class='display__layout-b-second' data-fit-text>City Rainstorm</span></h1>
      <p class='tagline'>Continuous Thundershowers &#8226; Night City Ambience</p>
    </section>
    <aside class='seal seal--real' aria-label='Real storm audio recording'>
      <svg class='seal__art' viewBox='0 0 112 112' role='img' aria-hidden='true'>
        <defs><path id='realTopPath' d='M 18,56 A 38,38 0 0,1 94,56'/><path id='realBottomPath' d='M 94,56 A 38,38 0 0,1 18,56'/></defs>
        <circle class='seal__outer' cx='56' cy='56' r='52'/>
        <text class='seal__ring-copy'><textPath href='#realTopPath' startOffset='50%' text-anchor='middle'>Authentic Storm</textPath></text>
        <text class='seal__ring-copy'><textPath href='#realBottomPath' startOffset='50%' text-anchor='middle'>Audio Recording</textPath></text>
        <text class='seal__real' x='56' y='59' text-anchor='middle' dominant-baseline='middle'>REAL</text>
      </svg>
    </aside>
    <footer class='features features--centered'>
      <div class='feature'><svg class='icon icon--small'><use href='#waveform'/></svg><div class='feature__copy'>Real Storm<br>Audio Recording</div></div>
      <div class='feature__divider'></div>
      <div class='feature'><svg class='icon icon--small'><use href='#headphones'/></svg><div class='feature__copy'>Continuous Rain<br>Distant Thunder</div></div>
      <div class='feature__divider'></div>
      <div class='feature'><svg class='icon icon--small'><use href='#moon'/></svg><div class='feature__copy'>Sleep &#8226; Study<br>Focus &#8226; Relax</div></div>
    </footer>
  </main>
</body>
</html>
